<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专业窗口 · 悬浮球菜单</title>
<link rel="stylesheet" href="dd.css">
<style>body{margin:0}
body{margin:0;padding:24px;background:#e9ebef}
</style>
</head>
<body>


<div class="dd" style="width: 1280px; height: 760px; position: relative; overflow: hidden; display: flex">
  <div class="dd-screen" style="background: linear-gradient(160deg, #3d4f63 0%, #2a3746 50%, #18212b 100%)">
    <div style="position: absolute; left: 120px; top: 90px; width: 640px; height: 440px; border-radius: 4px; background: #2b2f36; box-shadow: 0 10px 30px #00000066">
      <div style="height: 28px; background: #3a3f47"></div>
      <div style="position: absolute; left: 20px; top: 50px; right: 20px; bottom: 20px; border-radius: 2px; background: linear-gradient(135deg, #5f6b7a, #8b97a6)"></div>
    </div>
  </div>
  <div class="dd-ball dd-ball--hot" style="position: absolute; left: 1018px; top: 0" role="button" aria-label="控制中心"><svg class="dd-ico dd-ico--fill" viewBox="0 0 20 20" style="width: 20px; height: 20px"><path d="M8 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm-5 0A3.5 3.5 0 0 0 6.5 9h7a3.5 3.5 0 1 0 0-7h-7A3.5 3.5 0 0 0 3 5.5ZM6.5 3h7a2.5 2.5 0 0 1 0 5h-7a2.5 2.5 0 0 1 0-5Zm7 13a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM3 14.5A3.5 3.5 0 0 0 6.5 18h7a3.5 3.5 0 1 0 0-7h-7A3.5 3.5 0 0 0 3 14.5ZM6.5 12h7a2.5 2.5 0 0 1 0 5h-7a2.5 2.5 0 0 1 0-5Z"></path></svg></div>
  <div class="dd-menu" style="position: absolute; left: 1018px; top: 48px; width: 236px" role="menu" aria-label="控制中心（专业模式）">
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg>显示屏 1（VX2723）<svg class="dd-ico dd-ico--16 dd-mi__more" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></div>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg>切换下一个屏幕</div>
    <hr>
    <div class="dd-mi dd-mi--off"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>画质<span class="dd-mi__key">专业模式不生效</span></div>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" x2="14" y1="3" y2="10"></line><line x1="3" x2="10" y1="21" y2="14"></line></svg>分辨率<svg class="dd-ico dd-ico--16 dd-mi__more" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></div>
    <!-- 10-27 用户：照 UU，可选择的选项都不要图标 --><div class="dd-mi dd-mi--check">HDR</div>
    <div class="dd-mi dd-mi--off"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path></svg>窗口<span class="dd-mi__key">专业模式不生效</span></div>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path></svg>声音<svg class="dd-ico dd-ico--16 dd-mi__more" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></div>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>安全<svg class="dd-ico dd-ico--16 dd-mi__more" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></div>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="7"></rect><path d="M12 6v4"></path></svg>外设<svg class="dd-ico dd-ico--16 dd-mi__more" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></div>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>工具<svg class="dd-ico dd-ico--16 dd-mi__more" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></div>
    <div class="dd-mi dd-mi--hot"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>更多<svg class="dd-ico dd-ico--16 dd-mi__more" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg></div>
    <hr>
    <div class="dd-mi dd-mi--danger"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>退出远控</div>
  </div>
  <div class="dd-menu" style="position: absolute; left: 778px; top: 438px; width: 236px" role="menu" aria-label="更多">
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M10 8h.01"></path><path d="M12 12h.01"></path><path d="M14 8h.01"></path><path d="M16 12h.01"></path><path d="M18 8h.01"></path><path d="M6 8h.01"></path><path d="M7 16h10"></path><path d="M8 12h.01"></path><rect width="20" height="16" x="2" y="4" rx="2"></rect></svg>发送 Ctrl+Alt+Del</div>
    <div class="dd-mi dd-mi--off"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>刷新画面<span class="dd-mi__key">专业模式不生效</span></div>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg>重启远程电脑</div>
    <hr>
    <div class="dd-mi dd-mi--check dd-mi--on">显示质量监测<svg class="dd-ico dd-ico--16 dd-mi__check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg></div>
    <hr>
    <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg>切换到通用模式</div>
  </div>
  <div class="dd-monitor" style="right: 12px; bottom: 12px"><span>模式</span><span>专业 4:4:4 10bit</span><span>帧率</span><span>60</span><span>延迟</span><span>8 ms</span><span>码率</span><span>48 Mb/s</span></div>
</div>
