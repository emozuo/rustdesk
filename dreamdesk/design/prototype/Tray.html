<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>托盘菜单</title>
<link rel="stylesheet" href="dd.css">
<style>body{margin:0}
body{margin:0;padding:24px;background:#e9ebef}
</style>
</head>
<body>


<div class="dd" style="width: 1080px; height: 700px; position: relative; overflow: hidden; background: linear-gradient(160deg, #5d7f98 0%, #3d6178 45%, #23394a 100%)">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #e9ecf1f2; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding-right: 20px; font-size: 12px; color: #1f2329">
    <img src="icon.png" alt="DreamDesk 托盘图标" style="width: 18px; height: 18px; outline: 2px solid #3a7bfb55; outline-offset: 4px; border-radius: 3px">
    <span>23:40</span>
  </div>
  <div style="position: absolute; right: 64px; bottom: 60px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
    <span style="display: inline-flex; padding: 6px 10px; border-radius: 4px; background: #1f2329; color: #fff; font-size: 12px">DreamDesk · 服务正在运行 · 1 个会话</span>
    <div class="dd-menu" style="width: 200px" role="menu" aria-label="托盘菜单">
      <div class="dd-mi"><img src="icon.png" alt="" style="width: 16px; height: 16px">打开 DreamDesk</div>
      <hr>
      <div class="dd-mi"><svg class="dd-ico dd-ico--16" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg>停止服务</div>
    </div>
  </div>
</div>

</body>
</html>
