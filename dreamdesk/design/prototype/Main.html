<!doctype html>
<html lang="zh-CN">

<link rel="stylesheet" href="dd.css">
<style>body{margin:0;background:#e9ebef}

<div class="dd dd-window" style="width: 1080px; height: 700px">
  <div class="dd-mtb">
    <div class="dd-mtb__brand"><img src="icon.png" alt="">DreamDesk</div>
    <div class="dd-mtb__right">
      <button class="dd-iconbtn" aria-label="头像"><svg class="dd-ico dd-ico--20" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></button>
      <button class="dd-iconbtn" aria-label="更多"><svg class="dd-ico dd-ico--fill dd-ico--20" viewBox="0 0 20 20"><path d="M2 4.5c0-.28.22-.5.5-.5h15a.5.5 0 0 1 0 1h-15a.5.5 0 0 1-.5-.5Zm0 5c0-.28.22-.5.5-.5h15a.5.5 0 0 1 0 1h-15a.5.5 0 0 1-.5-.5Zm.5 4.5a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-15Z"></path></svg></button>

    </div>
  </div>

      <div class="dd-row dd-row--indent dd-row--selected"><span><i class="dd-dot" style="visibility: hidden"></i><svg class="dd-ico" viewBox="40 40 176 176" style="stroke: none; width: 20px; height: 20px" role="img" aria-label="全部设备"><path fill="#2f6fea" d="M120,80A40,40,0,1,1,80,40,40,40,0,0,1,120,80Z"></path><path fill="#86aef3" d="M176,120a40,40,0,1,0-40-40A40,40,0,0,0,176,120Z"></path><path fill="#86aef3" d="M80,136a40,40,0,1,0,40,40A40,40,0,0,0,80,136Z"></path><path fill="#2f6fea" d="M176,136a40,40,0,1,0,40,40A40,40,0,0,0,176,136Z"></path></svg>全部设备</span></div>
      <div style="flex: 1"></div>
      <div style="height: 1px; background: #e4e9ec; margin-bottom: 6px"></div>
      <div class="dd-row"><span><svg class="dd-ico" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>设置</span></div>
    </nav>
    <main class="dd-pane" style="flex: 1; min-width: 0; padding: 30px 40px; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700">全部设备</h1>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-bottom: 40px">
        <svg width="220" height="150" viewBox="0 0 220 150" aria-hidden="true">
          <rect x="30" y="18" width="160" height="100" rx="8" fill="#e8f0fe" stroke="#b9cdf7" stroke-width="2"></rect>
          <rect x="44" y="32" width="132" height="72" rx="4" fill="#ffffff"></rect>
          <rect x="56" y="46" width="52" height="8" rx="4" fill="#cfdcf8"></rect>
          <rect x="56" y="62" width="88" height="8" rx="4" fill="#e1e8f6"></rect>
          <rect x="56" y="78" width="70" height="8" rx="4" fill="#e1e8f6"></rect>
          <path d="M96 118h28l6 18H90z" fill="#d5e1fa"></path>
          <rect x="78" y="134" width="64" height="6" rx="3" fill="#b9cdf7"></rect>
          <circle cx="170" cy="96" r="22" fill="#3a7bfb"></circle>
          <circle cx="170" cy="90" r="6" fill="#ffffff"></circle>
          <path d="M159 107c2-6 6-9 11-9s9 3 11 9" fill="#ffffff"></path>

        <div style="color: #646a73">登录后查看授权给你的工作站</div>
        <button class="dd-btn dd-btn--primary" style="width: 160px">立即登录</button>
      </div>
    </main>
  </div>
</div>
