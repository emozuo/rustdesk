<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 左侧分类（方案 A）</title>
<link rel="stylesheet" href="dd.css">
<style>
body{margin:0;padding:24px;background:#e9ebef}
.note{font:600 14px/22px var(--font-sans);color:#1f2329;margin:20px 0 6px}
.sub{font:12px/20px var(--font-sans);color:#646a73;margin:0}
.cats{width:200px;flex:none;border-right:1px solid #eaeef1;padding-bottom:12px}
.cats h1{margin:0;height:62px;padding:10px 0 0 20px;box-sizing:border-box;display:flex;align-items:center;font-size:20px;font-weight:600}
.cats .dd-row > span{padding-left:22px}
.cats .dd-row--hover > span{background:var(--hover)}
</style>
</head>
<body>

<!-- 10-27 方案 A：设置页保留 RustDesk 的左侧分类布局，只换样子；分类图标从 Flutter 自带的 Material 换成 Lucide（用户 10-27 定） -->
<div class="dd" style="width: 860px; height: 420px; display: flex; background: var(--pane); border-radius: 10px; border: 1px solid #00000024; overflow: hidden">
  <div class="cats">
    <h1>设置</h1>
    <div class="dd-row dd-row--selected"><span><svg class="dd-ico" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>常规</span></div>
    <div class="dd-row dd-row--hover"><span><svg class="dd-ico" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>安全</span></div>
    <div class="dd-row"><span><svg class="dd-ico" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>网络</span></div>
    <div class="dd-row"><span><svg class="dd-ico" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>显示</span></div>
    <div class="dd-row"><span><svg class="dd-ico" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>账户</span></div>
    <div class="dd-row"><span><svg class="dd-ico" viewBox="0 0 24 24"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>打印机</span></div>
    <div class="dd-row"><span><svg class="dd-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>关于</span></div>
  </div>
  <div style="flex: 1; padding: 16px 15px">
    <div class="dd-group" style="width: 540px"><div class="dd-group__t">服务</div><div class="dd-sr"><div class="dd-sr__l"><div>正在运行</div></div><button class="dd-btn dd-btn--secondary dd-btn--compact">停止</button></div></div>
  </div>
</div>

<div class="note">分类图标（Lucide，18 像素，线宽 1.5，黑色；选中只换底色和左边蓝条，图标不变色）</div>
<p class="sub">常规 sliders-horizontal（左栏底部「设置」已用齿轮 settings，这里换成调节滑杆，免得两个一样）· 安全 shield · 网络 network · 显示 monitor · 账户 user · 打印机 printer（只有 Windows 有）· 关于 info</p>
<p class="sub">「安全」那行是鼠标停在上面的样子。右边内容区照第一版代码（白底卡片、组标题、开关在右），这里只画一张示意。</p>

</body>
</html>
