<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端口映射</title>
<link rel="stylesheet" href="dd.css">
<style>body{margin:0;background:#e9ebef}
body{margin:0;padding:24px;background:#e9ebef}
</style>
</head>
<body>


<div class="dd dd-window" style="width: 1080px; height: 700px">
  <div class="dd-titlebar">
    <img src="icon.png" alt="" style="width: 18px; height: 18px; margin-right: 8px">
    <span style="font-weight: 600">端口映射</span><span style="color: #646a73; margin-left: 8px">VM-CESHI</span>
    <div style="flex: 1"></div>
    <span class="dd-win" aria-hidden="true"><svg class="dd-ico" style="width: 16px; height: 16px; transform: translate(0.5px, 0.5px)" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></span>
    <span class="dd-win" aria-hidden="true"><svg class="dd-ico" style="width: 16px; height: 16px; transform: translate(0.5px, 0.5px)" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/></svg></span>
    <span class="dd-win dd-win--close" aria-hidden="true"><svg class="dd-ico" style="width: 16px; height: 16px; transform: translate(0.5px, 0.5px)" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
  </div>
  <div style="flex: 1; background: #f7f8fa; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px">
    <div class="dd-tip dd-tip--warn" style="align-items: center"><svg class="dd-ico" style="color: #f97316" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>用映射时别关这个窗口，关了映射就断开。</div>
    <div class="dd-group" style="padding: 0">
      <div style="display: grid; grid-template-columns: 140px 1fr 140px 140px 120px; gap: 12px; align-items: center; padding: 0 20px; height: 40px; font-size: 12px; color: #646a73; border-bottom: 1px solid #eef0f3"><span>本机端口</span><span>远程主机</span><span>远程端口</span><span>状态</span><span></span></div>
      <div style="display: grid; grid-template-columns: 140px 1fr 140px 140px 120px; gap: 12px; align-items: center; padding: 0 20px; height: 52px; border-bottom: 1px solid #eef0f3">
        <label class="dd-input"><input aria-label="本机端口" placeholder="例如 8080"></label>
        <label class="dd-input"><input aria-label="远程主机" value="localhost"></label>
        <label class="dd-input"><input aria-label="远程端口" placeholder="例如 80"></label>
        <span></span>
        <button class="dd-btn dd-btn--primary dd-btn--compact">添加</button>
      </div>
      <div style="display: grid; grid-template-columns: 140px 1fr 140px 140px 120px; gap: 12px; align-items: center; padding: 0 20px; height: 48px; font-size: 13px">
        <span>8080</span><span>localhost</span><span>80</span>
        <span style="display: flex; align-items: center; gap: 6px; color: #646a73"><i class="dd-dot" style="background: #22c55e"></i>正在监听</span>
        <button class="dd-btn dd-btn--text dd-btn--compact" style="color: #d13438">删除</button>
      </div>
    </div>
    <div><button class="dd-btn dd-btn--secondary dd-btn--compact">新建远程桌面（RDP）映射</button></div>
  </div>
</div>

</body>
</html>
