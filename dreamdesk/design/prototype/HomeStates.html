<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主窗口 · 加载中 / 没有授权 / 出错</title>
<link rel="stylesheet" href="dd.css">
<style>body{margin:0}
body{margin:0;padding:24px;background:#e9ebef}
</style>
</head>
<body>


<div class="dd" style="width: 1080px; height: 700px; background: #f0f5f8; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; color: #646a73">加载中</div>
    <div class="dd-pane" style="flex: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #646a73">
      <svg fill="none" stroke="#3a7bfb" stroke-width="2" stroke-linecap="round" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
      正在加载…
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; color: #646a73">还没有授权的工作站</div>
    <div class="dd-pane" style="flex: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <svg width="96" height="72" viewBox="0 0 96 72" aria-hidden="true"><rect x="10" y="6" width="76" height="48" rx="6" fill="#e8f0fe" stroke="#b9cdf7" stroke-width="2"></rect><path d="M40 54h16l3 10H37z" fill="#d5e1fa"></path><path d="M36 30h24" stroke="#b9cdf7" stroke-width="3" stroke-linecap="round"></path></svg>
      <div>还没有给你分配工作站</div>
      <div style="font-size: 12px; color: #646a73">请联系 IT</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; color: #646a73">连不上服务器</div>
    <div class="dd-pane" style="flex: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path><path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path><path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path><path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path><path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path><path d="m2 2 20 20"></path></svg>
      <div>连不上服务器</div>
      <div style="font-size: 12px; color: #646a73">检查网络后重试</div>
      <button class="dd-btn dd-btn--secondary dd-btn--compact">重试</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; color: #646a73">登录过期</div>
    <div class="dd-pane" style="flex: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <div>登录已过期，请重新登录</div>
      <button class="dd-btn dd-btn--primary dd-btn--compact">重新登录</button>
    </div>
  </div>
</div>

</body>
</html>
