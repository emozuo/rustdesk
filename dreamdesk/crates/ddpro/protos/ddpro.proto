syntax = "proto3";
package ddpro;

// 专业协议的信封，装在 RustDesk Message 的 `bytes dd_pro` 里。
// 字段 1 的编号和类型永远不能改：对端先读它，版本不一致就拒绝，不解释后面的内容。
message DdPro {
  uint32 version = 1;
  oneof union {
    Hello hello = 2;
    Accept accept = 3;
    Reject reject = 4;
    Stopped stopped = 6;
    Released released = 8;
  }
  // 5：v2–v3 的「请求关键帧」（经 RustDesk 原连接）；v4 起改在画面通道上回发。
  // 7：v7–v9 的「开 / 关抖动」（界面没有入口，只有诊断开关触发；HDR 定为走 10bit 后用不上，2026-10-22 删）
  reserved 5, 7;
}

// 被控端 → 主控端（v5 起）：被控端这一侧的专业画面停了、已退回通用画面。
// 主控端据此马上关专业窗口、挂提示写明原因，不必等画面通道 3 秒没画面才发现。
message Stopped {
  enum Reason {
    // 采集、编码等被控端自己的环节出错
    VIDEO_ERROR = 0;
    // 画面通道通了又断了（被控端 3 秒收不到主控端的心跳，如防火墙挡了回程）
    CHANNEL_LOST = 1;
    // 主控端一直没来打招呼，画面通道没通
    CHANNEL_FAILED = 2;
    // 被控端这块屏拿不到画面（建了采集器一直没有第一帧，常见于没接显示器）
    NO_IMAGE = 3;
    // v6 起：被控端开了放大镜方式的隐私模式（老版本 Windows 才用它），专业采集看不穿
    PRIVACY_MODE = 4;
  }
  string detail = 1;
  Reason reason = 2;
  // v6 起：停的是被控端哪块屏。主控端切过屏后，旧屏晚到的这条消息不能关掉新屏的专业窗口
  uint32 display_index = 3;
}

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_PRO = 1;
}

enum Chroma {
  CHROMA_UNSPECIFIED = 0;
  CHROMA_420 = 1;
  CHROMA_444 = 2;
}

message VideoFormat {
  Chroma chroma = 1;
  uint32 bit_depth = 2;
}

// 还没有探测的能力报 checked = false，而不是猜一个值，免得「没查」被当成「支持」。
message FormatCaps {
  bool checked = 1;
  repeated VideoFormat formats = 2;
}

message DisplayCaps {
  bool checked = 1;
  bool available = 2;
}

// 主控端 → 被控端：要哪一档、哪块屏，以及本机能解什么、能不能显示。
message Hello {
  Tier tier = 1;
  FormatCaps decode = 2;
  DisplayCaps display = 3;
  // 被控端的屏幕序号（和 RustDesk 的显示器序号一致）
  uint32 display_index = 4;
}

// 专业画面通道的连接信息（含密钥）。经 RustDesk 的连接传送：RustDesk 连接加密时（配了服务器公钥、校验通过）
// 不出现在明文里；RustDesk 退回明文连接时它也是明文——和通用画面、键鼠同等。
message MediaChannel {
  // 被控端的地址：RustDesk 连接在被控端这一侧的地址，主控端连得到它
  string host = 1;
  uint32 port = 2;
  // 主控端打招呼时带上，被控端据此认准主控端的地址
  bytes token = 3;
  // SRTP（AES-128-GCM）主密钥 16 字节、盐 12 字节
  bytes srtp_key = 4;
  bytes srtp_salt = 5;
  uint32 ssrc_media = 6;
  uint32 ssrc_control = 7;
}

// 被控端 → 主控端：同意，并给出选定的格式和画面通道。
// 任何一方的能力还没探测时没有 format / media，表示只谈通了协议。
message Accept {
  VideoFormat format = 1;
  MediaChannel media = 2;
  // v9 起：答的是哪块屏的请求（多屏时几块屏的请求同时在路上）
  uint32 display_index = 3;
}

// 被控端 → 主控端（v9 起）：主控端关了这块屏的专业窗口，被控端的专业会话已结束、专业服务已退订（出错结束的照旧发 Stopped）。
// 这块屏还在主控端某个窗口里时，主控端据此把它的普通画面要回来——这条连接还要不要这块屏，只有主控端知道
message Released {
  uint32 display_index = 1;
}

message Reject {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    VERSION_MISMATCH = 1;
    UNSUPPORTED_TIER = 2;
    NO_COMMON_FORMAT = 3;
    DISPLAY_UNAVAILABLE = 4;
    MALFORMED = 5;
    // 这块屏已经有别的专业会话，或有别的连接在用通用模式看（同一块屏专业模式不共享）
    DISPLAY_BUSY = 6;
    // 被控端这一侧准备不了（采集、编码器、开端口失败），原因在 detail 里
    UNAVAILABLE = 7;
  }
  Reason reason = 1;
  string detail = 2;
  // v9 起：拒的是哪块屏的请求（请求本身解不开、版本不一致时为 0）
  uint32 display_index = 3;
}

// ---------------------------------------------------------------------------------------------
// 主控端本机：会话进程 ↔ 专业窗口进程（`--pro-view`，会话进程拉起的子进程）。
// 经子进程的标准输入 / 输出传，每条前面 4 字节长度（小端）。只在同一台机器的父子进程之间，
// 两端总是同一个程序，不参与版本谈判。

// 会话进程 → 专业窗口
message ViewDown {
  oneof union {
    ViewStart start = 1;
    // RustDesk 连接里收到的、专业窗口要用的消息（RustDesk Message：光标 CursorData / CursorId，
    // 本屏的显示变化 Misc.SwitchDisplay），原样转发
    bytes rustdesk = 2;
  }
}

message ViewStart {
  MediaChannel media = 1;
  // 远程这块屏在远程桌面坐标里的位置和尺寸：把窗口坐标换算成远程坐标用
  int32 remote_x = 2;
  int32 remote_y = 3;
  uint32 remote_width = 4;
  uint32 remote_height = 5;
  string title = 6;
  // 这个专业窗口看的是哪块屏（悬浮球菜单「切换显示器」用；被控端有几块屏看 display_origins）
  reserved 7;
  int32 display_index = 8;
  // 悬浮球菜单的网络状态块开着（本会话里用户开过，换屏开新的专业窗口时照旧）
  bool show_status = 9;
  // 被控端各块屏左上角在远程桌面坐标里的位置（按屏号）。多屏时（all_displays）专业窗口据此把远程屏按位置对上本机屏
  repeated ViewPoint display_origins = 10;
  // 主控端打开了「将我的所有显示器用于远程会话」：本机和远程都多于一块屏时，这个窗口固定看这块屏、全屏到对应的本机屏
  bool all_displays = 11;
}

message ViewPoint {
  int32 x = 1;
  int32 y = 2;
}

// 专业窗口 → 会话进程
message ViewUp {
  oneof union {
    ViewKey key = 1;
    ViewMouse mouse = 2;
    // 专业窗口要结束了：为什么（会话进程据此决定挂不挂「非专业模式」提示）
    ViewEnded ended = 3;
    // 第一帧专业画面已经显示出来（会话进程据此撤掉提示）
    bool ready = 4;
    // 悬浮球菜单里选的动作（「断开连接」不在这里：专业窗口直接按用户关窗结束，见 ViewEnded）
    ViewAction action = 6;
  }
  // 5：每秒一次的实测值，给 RustDesk 的质量面板（专业画面出来后通用窗口藏起来，面板看不到，2026-10-22 删）
  reserved 5;
}

// 悬浮球菜单里选的动作，由会话进程调 RustDesk 已有的会话功能
message ViewAction {
  oneof union {
    // 切到被控端第几块屏
    int32 switch_display = 1;
    bool ctrl_alt_del = 2;
    bool lock_screen = 3;
    // 网络状态块开 / 关：会话进程记下来，换屏开新的专业窗口时照旧
    bool show_status = 4;
    // 切到通用模式（只对这次会话）：会话进程关掉专业窗口、显示通用窗口，被控端退回通用画面
    bool general_mode = 5;
    // 改远程这块屏的分辨率：会话进程调 RustDesk 工具栏「分辨率」菜单的同一个函数
    ViewResolution change_resolution = 6;
  }
}

message ViewResolution {
  uint32 width = 1;
  uint32 height = 2;
}

message ViewEnded {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // 用户关了专业窗口
    USER_CLOSED = 1;
    // 会话进程让它关的（会话结束、换屏、被控端报告出错）
    SESSION_CLOSED = 2;
    // 画面通道通过之后又断了（3 秒没有画面）
    CHANNEL_LOST = 3;
    // 画面通道一直没通
    CHANNEL_FAILED = 4;
    // 本机显示不了（窗口、硬解、颜色转换、提交出错）
    DISPLAY_ERROR = 5;
  }
  Kind kind = 1;
  string detail = 2;
}

// 和 Flutter 窗口交给 RustDesk 的一样：位置码是 X 键码（evdev + 8）
message ViewKey {
  int32 position_code = 1;
  bool down = 2;
  // RustDesk 的锁定键位：1 << 1 大写锁定，1 << 2 数字锁定，1 << 3 滚动锁定
  int32 lock_modes = 3;
}

// 和 RustDesk 鼠标入口的参数一一对应：mask = 事件类型 | (按键 << 3)；移动 / 按下 / 抬起时 x、y 是远程坐标，
// 滚轮时是格数（往下滚为 -1）
message ViewMouse {
  int32 mask = 1;
  int32 x = 2;
  int32 y = 3;
  bool alt = 4;
  bool ctrl = 5;
  bool shift = 6;
  bool command = 7;
}
