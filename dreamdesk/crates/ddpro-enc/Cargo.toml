[package]
name = "ddpro-enc"
version = "0.1.0"
edition = "2021"
publish = false

# 验证工具（examples/capture_encode.rs）用 RustDesk 的采集模块拿真实桌面画面；采集直接输出显卡纹理绑在
# scrap 的 vram 功能上。单独一个开关、平时不编：scrap 的 vram 若被这里带进工作区的整体编译（cargo test /
# check --all-targets），会和 RustDesk 主程序没开 vram 时的代码对不上而编不过。
# 编验证工具：cargo build -p ddpro-enc --example capture_encode --features harness --release
[features]
harness = ["dep:scrap"]

[[example]]
name = "capture_encode"
required-features = ["harness"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }
scrap = { path = "../../../libs/scrap", features = ["vram"], optional = true }
